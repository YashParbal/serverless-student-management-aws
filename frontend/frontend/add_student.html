<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #2c2c2c;
            color: white;
        }

        .container {
            max-width: 600px;
            margin: 80px auto;
            background-color: #3c3c3c;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            color: #ffcc00;
        }

        label {
            color: #ffcc00;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px 0;
            box-sizing: border-box;
            border-radius: 5px;
            border: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #ffcc00;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #e6b800;
        }

        #message {
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #ffcc00;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Add Student</h1>

    <label>Student ID</label>
    <input type="text" id="studentid">

    <label>Name</label>
    <input type="text" id="name">

    <label>Class</label>
    <input type="text" id="class">

    <label>Age</label>
    <input type="text" id="age">

    <button id="saveStudent">
        Save Student
    </button>

    <p id="message"></p>

    <a href="index.html" class="back">
        Back to Home
    </a>

</div>

<script src="scripts.js"></script>

</body>
</html>
