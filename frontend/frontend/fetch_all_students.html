<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>All Students</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #2c2c2c;
            color: white;
        }

        .container {
            max-width: 900px;
            margin: 70px auto;
            background-color: #3c3c3c;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            color: #ffcc00;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 12px 30px;
            background-color: #ffcc00;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #e6b800;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }

        th,
        td {
            border: 1px solid white;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #ffcc00;
            color: #222;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #ffcc00;
            text-decoration: none;
            font-weight: bold;
        }

        #status {
            text-align: center;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>All Students</h1>

    <button id="loadStudents">
        Load Students
    </button>

    <p id="status"></p>

    <table>

        <thead>
            <tr>
                <th>Student ID</th>
                <th>Name</th>
                <th>Class</th>
                <th>Age</th>
            </tr>
        </thead>

        <tbody id="studentTable">
        </tbody>

    </table>

    <a href="index.html" class="back">
        Back to Home
    </a>

</div>

<script src="scripts.js"></script>

</body>
</html>
